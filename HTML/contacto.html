<!DOCTYPE html>
<html lang="es" data-saber="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacta con nosotros.">
  <title>Contacto | Star Wars</title>
  <link rel="shortcut icon" href="../Image/R2D2.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/style.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="../js/vendor/gsap.min.js"></script>
  <script defer src="../js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="../js/main.js"></script>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <header class="site-header">
    <div class="wrap nav">
      <a href="../index.html" class="logo" aria-label="Star Wars — inicio"></a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false"><span></span></button>
      <div class="menu">
        <ul class="nav-links"><li><a href="../index.html">Inicio</a></li><li><a href="galeria.html">Galería</a></li><li><a href="contacto.html" class=active>Contacto</a></li></ul>
        <div class="sabers" role="group" aria-label="Color del sable">
          <button class="saber" data-saber="blue" style="--c:#3aa0ff" aria-label="Sable azul"></button>
          <button class="saber" data-saber="green" style="--c:#38e58b" aria-label="Sable verde"></button>
          <button class="saber" data-saber="red" style="--c:#ff4655" aria-label="Sable rojo"></button>
        </div>
      </div>
    </div>
  </header>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Contacto</span>
      <h1>Contáctanos</h1>
      <p>Envía tu mensaje a través del holocomunicador.</p>
    </div>
  </section>
  <section class="wrap" style="padding-bottom:120px">
    <div class="contact-wrap" data-reveal>
      <div class="holo">
        <form class="form">
          <div class="field"><label for="name">Nombre</label><input id="name" name="name" type="text" required autocomplete="given-name"></div>
          <div class="field"><label for="lastname">Apellido</label><input id="lastname" name="lastname" type="text" autocomplete="family-name"></div>
          <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label for="phone">Número telefónico</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field full"><label for="message">Mensaje</label><textarea id="message" name="message" required></textarea></div>
          <div class="field full"><button type="submit" class="btn btn-solid" style="justify-content:center">Enviar transmisión</button></div>
          <p class="form-note" role="status"></p>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <a href="../index.html" class="logo" aria-label="Star Wars — inicio"></a>
      <ul class="footer-links"><li><a href="../index.html">Inicio</a></li><li><a href="galeria.html">Galería</a></li><li><a href="contacto.html">Contacto</a></li></ul>
      <div class="socials">
        <a href="https://github.com/mariangela-gomez" target="_blank" rel="noopener" aria-label="GitHub"><i class="bi bi-github"></i></a>
        <a href="https://www.linkedin.com/in/mariangelagomez/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>
      <p class="copy">Sitio de fans creado por <a href="https://mariangelagomez.com" target="_blank" rel="noopener">Mariangela Gomez</a>. Star Wars es marca de Lucasfilm Ltd.</p>
    </div>
  </footer>
</body>
</html>
